<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理后台</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="console admin">
<header>
  <div class="brand">世界推演 · 管理后台</div>
  <nav class="tabs" id="tabs">
    <button data-tab="overview" class="on">概览</button>
    <button data-tab="tenants">用户</button>
    <button data-tab="jobs">任务</button>
    <button data-tab="settings">套餐与接口配置</button>
    <button data-tab="ai">AI 识图</button>
    <button data-tab="audit">审计日志</button>
  </nav>
  <div class="spacer"></div>
  <span class="muted" id="gen"></span>
  <button class="ghost" id="btnRefresh">刷新</button>
  <button class="ghost" id="btnLogout">退出</button>
  <span id="langSlot"></span>
</header>
<main>
  <section id="tab-overview"></section>
  <section id="tab-tenants" hidden></section>
  <section id="tab-jobs" hidden></section>
  <section id="tab-settings" hidden></section>
  <section id="tab-ai" hidden></section>
  <section id="tab-audit" hidden></section>
</main>
<dialog id="tenantDlg"><div id="tenantBody"></div></dialog>
<dialog id="newTenantDlg">
  <form method="dialog" class="form" id="newTenantForm" style="min-width:min(520px,90vw)">
    <h2 class="full" style="margin:0">新建用户</h2>
    <label>名称</label><input name="name" required>
    <label>邮箱</label><input name="email" type="email">
    <label>套餐</label><select name="plan"></select>
    <label>备注</label><input name="note">
    <div class="full dlgBtns"><button value="cancel" class="ghost" formnovalidate>取消</button><button value="ok">创建</button></div>
  </form>
</dialog>
<script type="module" src="admin.js"></script>
</body>
</html>
